<!DOCTYPE html>
<!--
	Virtual Stage Director — Sponsor / Partner Spotlight
	Canonical deployment:
	https://thediarmanimethod.github.io/Virtual-Stage-Director-Overlays/sponsor_spotlight_overlay.html

	QR generation uses qrcode-generator by Kazuhiko Arase (MIT), loaded from
	the same reviewed GitHub Pages repository. No external QR service is used.
-->
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=1920,height=1080">
	<title>Virtual Stage Director Sponsor Spotlight</title>
	<style>
		:root {
			--panel:#1d2330;
			--text:#ffffff;
			--accent:#ffd166;
			--duration-ms:20000ms;
			--exit-delay:19600ms;
		}
		* { box-sizing:border-box; }
		html, body {
			width:1920px;
			height:1080px;
			margin:0;
			overflow:hidden;
			background:transparent;
			color:var(--text);
			font-family:Inter,"Segoe UI",Arial,sans-serif;
		}
		body { color:var(--text); }
		#stage {
			position:fixed;
			inset:0;
			display:grid;
			place-items:end center;
			padding:72px 96px 50px;
		}
		#spotlight {
			position:relative;
			width:100%;
			max-width:1580px;
			padding:36px 50px 32px;
			overflow:hidden;
			border:2px solid color-mix(in srgb,var(--accent) 72%,transparent);
			border-radius:38px;
			background:var(--panel);
			box-shadow:0 34px 110px rgba(0,0,0,.48);
		}
		#spotlight::before {
			content:"";
			position:absolute;
			inset:0 auto 0 0;
			width:12px;
			background:var(--accent);
		}
		#spotlight::after {
			content:"";
			position:absolute;
			width:620px;
			height:620px;
			right:-310px;
			top:-390px;
			border-radius:50%;
			background:var(--accent);
			opacity:.09;
		}
		#content {
			position:relative;
			z-index:1;
			display:grid;
			grid-template-columns:390px minmax(0,1fr);
			gap:48px;
			align-items:center;
		}
		#logo-shell {
			position:relative;
			width:100%;
			height:280px;
			display:flex;
			align-items:center;
			justify-content:center;
			padding:24px;
			overflow:hidden;
			border:1px solid rgba(255,255,255,.2);
			border-radius:28px;
			background:
				linear-gradient(135deg,rgba(255,255,255,.98),rgba(242,244,248,.94));
			box-shadow:inset 0 0 0 1px rgba(0,0,0,.04),0 20px 50px rgba(0,0,0,.22);
		}
		#logo {
			display:block;
			width:100%;
			height:100%;
			object-fit:contain;
			object-position:center;
		}
		#logo-fallback {
			display:none;
			width:150px;
			height:150px;
			align-items:center;
			justify-content:center;
			border:5px solid var(--accent);
			border-radius:50%;
			background:var(--panel);
			color:var(--text);
			font-size:52px;
			font-weight:850;
			letter-spacing:-.04em;
			text-align:center;
		}
		#logo-shell.failed #logo { display:none; }
		#logo-shell.failed #logo-fallback { display:flex; }
		#copy { min-width:0; }
		#relationship {
			margin:0 0 10px;
			color:var(--accent);
			font-size:20px;
			font-weight:850;
			letter-spacing:.15em;
			text-transform:uppercase;
		}
		#name {
			margin:0 0 14px;
			max-width:820px;
			font-size:50px;
			line-height:1.02;
			letter-spacing:-.03em;
			overflow-wrap:anywhere;
		}
		#message {
			margin:0 0 18px;
			max-width:850px;
			font-size:28px;
			line-height:1.28;
			font-weight:470;
			white-space:pre-wrap;
			overflow-wrap:anywhere;
		}
		#destination {
			display:grid;
			grid-template-columns:minmax(0,1fr) 180px;
			gap:22px;
			align-items:center;
		}
		#destination.no-qr { grid-template-columns:minmax(0,1fr); }
		#website-block {
			min-width:0;
			padding:14px 18px;
			border-left:7px solid var(--accent);
			border-radius:0 15px 15px 0;
			background:rgba(255,255,255,.075);
		}
		#website-label {
			display:block;
			margin-bottom:5px;
			opacity:.72;
			font-size:17px;
			font-weight:800;
			letter-spacing:.12em;
			text-transform:uppercase;
		}
		#website {
			display:block;
			font-size:23px;
			line-height:1.24;
			font-weight:760;
			overflow-wrap:anywhere;
		}
		#qr-panel { text-align:center; }
		#qr {
			width:164px;
			height:164px;
			margin:0 auto 7px;
			padding:8px;
			display:grid;
			background:#fff;
			box-shadow:0 12px 28px rgba(0,0,0,.26);
		}
		.qr-row { display:flex; flex:1; }
		.qr-cell { flex:1; }
		.qr-cell.dark { background:#000; }
		.qr-cell.light { background:#fff; }
		#scan-label {
			font-size:15px;
			font-weight:760;
			letter-spacing:.04em;
		}
		#duration-track {
			position:absolute;
			z-index:2;
			left:50px;
			right:50px;
			bottom:18px;
			height:4px;
			overflow:hidden;
			border-radius:4px;
			background:rgba(255,255,255,.12);
		}
		#duration-progress {
			width:100%;
			height:100%;
			border-radius:inherit;
			background:var(--accent);
			transform:scaleX(0);
			transform-origin:left center;
			animation:progress var(--duration-ms) linear both;
		}
		#invalid {
			display:none;
			padding:24px 30px;
			border-radius:18px;
			background:#7b1e28;
			color:#fff;
			font-size:32px;
		}
		@keyframes progress {
			from { transform:scaleX(0); }
			to { transform:scaleX(1); }
		}
		@media (prefers-reduced-motion:no-preference) {
			#spotlight {
				animation:
					arrive .46s cubic-bezier(.2,.75,.25,1) both,
					depart .4s ease-in var(--exit-delay) forwards;
			}
			@keyframes arrive {
				from { opacity:0; transform:translateY(22px) scale(.988); }
				to { opacity:1; transform:none; }
			}
			@keyframes depart {
				from { opacity:1; transform:none; }
				to { opacity:0; transform:translateY(-12px) scale(.994); }
			}
		}
		@media (prefers-reduced-motion:reduce) {
			#duration-track { display:none; }
			#duration-progress { animation:none; }
		}
	</style>
</head>
<body>
	<main id="stage" aria-live="polite">
		<section id="spotlight" aria-labelledby="name">
			<div id="content">
				<div id="logo-shell">
					<img id="logo" alt="">
					<div id="logo-fallback" aria-hidden="true"></div>
				</div>
				<div id="copy">
					<p id="relationship"></p>
					<h1 id="name"></h1>
					<p id="message"></p>
					<div id="destination">
						<div id="website-block">
							<span id="website-label">Learn more</span>
							<span id="website"></span>
						</div>
						<aside id="qr-panel" aria-label="QR code">
							<div id="qr"></div>
							<div id="scan-label">Scan to visit</div>
						</aside>
					</div>
				</div>
			</div>
			<div id="duration-track" aria-hidden="true">
				<div id="duration-progress"></div>
			</div>
		</section>
		<div id="invalid">Sponsor Spotlight configuration unavailable</div>
	</main>

	<script src="qrcode.js"></script>
	<script>
	(function() {
		'use strict';
		var PREFIX = '#vsd-sponsor-spotlight=';
		var MAX_FRAGMENT = 10000;
		var MIN_DURATION_MS = 5000;
		var MAX_DURATION_MS = 120000;

		function text(value, maximum) {
			return typeof value === 'string' ? value.trim().slice(0, maximum) : '';
		}

		function httpsUrl(value) {
			try {
				var parsed = new URL(value);
				if (parsed.protocol !== 'https:' || parsed.username || parsed.password) return null;
				return parsed;
			} catch (_) {
				return null;
			}
		}

		function hex(value, fallback) {
			return typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value) ?
				value : fallback;
		}

		function rgba(value, opacity) {
			var normalized = hex(value, '#1d2330').slice(1);
			return 'rgba(' + parseInt(normalized.slice(0, 2), 16) + ',' +
				parseInt(normalized.slice(2, 4), 16) + ',' +
				parseInt(normalized.slice(4, 6), 16) + ',' + opacity + ')';
		}

		function readPayload() {
			var hash = String(window.location.hash || '');
			if (hash.length > MAX_FRAGMENT || hash.indexOf(PREFIX) !== 0) {
				throw new Error('invalid fragment');
			}
			var payload = JSON.parse(decodeURIComponent(hash.slice(PREFIX.length)));
			var relationship = payload && payload.relationship;
			var name = text(payload && payload.name, 100);
			var message = text(payload && payload.message, 240);
			var logoUrl = httpsUrl(payload && payload.logoUrl);
			var websiteUrl = httpsUrl(payload && payload.websiteUrl);
			var durationMs = Number(payload && payload.durationMs);
			if (!payload || payload.version !== 1 ||
				(relationship !== 'presented-by' && relationship !== 'with-support-from') ||
				!text(payload.sessionId, 120) || !name || !message || !logoUrl || !websiteUrl ||
				!Number.isInteger(durationMs) || durationMs < MIN_DURATION_MS ||
				durationMs > MAX_DURATION_MS) {
				throw new Error('invalid payload');
			}
			var opacity = Number(payload.theme && payload.theme.panelOpacity);
			return {
				sessionId: text(payload.sessionId, 120),
				relationship: relationship,
				name: name,
				message: message,
				logoUrl: logoUrl.href,
				websiteUrl: websiteUrl.href,
				websiteDisplay: websiteUrl.host +
					(websiteUrl.pathname === '/' ? '' : websiteUrl.pathname) +
					websiteUrl.search,
				qr: payload.qr === true,
				durationMs: durationMs,
				theme: {
					panel: hex(payload.theme && payload.theme.panel, '#1d2330'),
					text: hex(payload.theme && payload.theme.text, '#ffffff'),
					accent: hex(payload.theme && payload.theme.accent, '#ffd166'),
					panelOpacity: Number.isFinite(opacity) ?
						Math.min(1, Math.max(.72, opacity)) : .94
				}
			};
		}

		function initials(name) {
			var words = name.split(/\s+/).filter(Boolean);
			if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
			return (words[0].slice(0, 1) + words[words.length - 1].slice(0, 1)).toUpperCase();
		}

		function renderQr(url) {
			var container = document.getElementById('qr');
			var code = qrcode(0, 'M');
			code.addData(url, 'Byte');
			code.make();
			var count = code.getModuleCount();
			container.style.gridTemplateRows = 'repeat(' + count + ',1fr)';
			for (var row = 0; row < count; row++) {
				var rowElement = document.createElement('div');
				rowElement.className = 'qr-row';
				for (var column = 0; column < count; column++) {
					var cell = document.createElement('div');
					cell.className = 'qr-cell ' +
						(code.isDark(row, column) ? 'dark' : 'light');
					rowElement.appendChild(cell);
				}
				container.appendChild(rowElement);
			}
		}

		function failClosed() {
			document.getElementById('spotlight').style.display = 'none';
			document.getElementById('invalid').style.display = 'block';
		}

		function render() {
			try {
				var payload = readPayload();
				var root = document.documentElement;
				root.style.setProperty('--panel',
					rgba(payload.theme.panel, payload.theme.panelOpacity));
				root.style.setProperty('--text', payload.theme.text);
				root.style.setProperty('--accent', payload.theme.accent);
				root.style.setProperty('--duration-ms', payload.durationMs + 'ms');
				root.style.setProperty('--exit-delay',
					Math.max(0, payload.durationMs - 400) + 'ms');

				document.getElementById('relationship').textContent =
					payload.relationship === 'presented-by' ?
						'Presented by' : 'With support from';
				document.getElementById('name').textContent = payload.name;
				document.getElementById('message').textContent = payload.message;
				document.getElementById('website').textContent = payload.websiteDisplay;

				var logo = document.getElementById('logo');
				var shell = document.getElementById('logo-shell');
				var fallback = document.getElementById('logo-fallback');
				fallback.textContent = initials(payload.name);
				logo.alt = payload.name + ' logo';
				logo.addEventListener('error', function() {
					shell.classList.add('failed');
					shell.setAttribute('aria-label', payload.name + ' logo unavailable');
				});
				logo.src = payload.logoUrl;

				var qrPanel = document.getElementById('qr-panel');
				var destination = document.getElementById('destination');
				qrPanel.style.display = payload.qr ? 'block' : 'none';
				destination.className = payload.qr ? '' : 'no-qr';
				if (payload.qr) renderQr(payload.websiteUrl);
			} catch (_) {
				failClosed();
			}
		}

		render();
	})();
	</script>
</body>
</html>
