<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bullet Points Manual Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif}
#stage{position:absolute;left:var(--pos-x,7%);bottom:var(--pos-y,10%);display:flex;flex-direction:column;gap:var(--row-gap,18px)}
.row{display:flex;align-items:center;opacity:0;transform:translateX(-40px);transition:opacity .24s ease,transform .24s ease;pointer-events:none}
.row.visible{opacity:1;transform:translateX(0)}
.icon-circle{width:var(--icon-size,64px);height:var(--icon-size,64px);border-radius:50%;background:var(--accent-color,#ffe6a7);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-circle svg{width:68%;height:68%}.bubble-wrap{display:flex;align-items:center;margin-left:10px}
.tail{width:0;height:0;border-top:12px solid transparent;border-bottom:12px solid transparent;border-right:var(--tail-depth,16px) solid var(--bubble-bg,rgba(30,20,10,.88))}
.bubble{background:var(--bubble-bg,rgba(30,20,10,.88));border-radius:var(--bubble-radius,14px);padding:.45em .85em 1em;white-space:nowrap}
.bubble-text{font-size:var(--font-size,48px);font-weight:var(--font-weight,600);color:var(--text-color,#fff);line-height:1.2}
</style>
</head>
<body>
<div id="stage"></div>
<script>
(function(){
  'use strict';
  const params=new URLSearchParams(location.search);
  const value=(key,fallback)=>params.get(key)??fallback;
  const sessionId=value('sessionId','');
  const connectionGeneration=Number(value('connectionGeneration','-1'));
  const items=[];
  for(let index=1;index<=8;index++){
    const item=params.get('item'+index);
    if(item&&item.trim())items.push(item.trim());
  }
  if(!sessionId||!Number.isSafeInteger(connectionGeneration)||connectionGeneration<0||!items.length)return;
  const root=document.documentElement;
  function rgba(hex,opacity){
    const clean=String(hex).replace('#','');
    const full=clean.length===3?clean.split('').map(char=>char+char).join(''):clean;
    const number=parseInt(full,16);
    if(!Number.isFinite(number))return 'rgba(30,20,10,.88)';
    return `rgba(${(number>>16)&255},${(number>>8)&255},${number&255},${(opacity/100).toFixed(2)})`;
  }
  root.style.setProperty('--accent-color',value('accentColor','#ffe6a7'));
  root.style.setProperty('--bubble-bg',rgba(value('bubbleBg','#432818'),Math.max(0,Math.min(100,Number(value('bubbleOpacity','88'))))));
  root.style.setProperty('--text-color',value('textColor','#fff'));
  root.style.setProperty('--font-size',value('fontSize','48')+'px');
  root.style.setProperty('--font-weight',value('fontWeight','600'));
  root.style.setProperty('--icon-size',value('iconSize','64')+'px');
  root.style.setProperty('--tail-depth',value('tailDepth','16')+'px');
  root.style.setProperty('--bubble-radius',value('bubbleRadius','14')+'px');
  root.style.setProperty('--row-gap',value('rowGap','18')+'px');
  root.style.setProperty('--pos-x',value('posX','7')+'%');
  root.style.setProperty('--pos-y',value('posY','10')+'%');
  const googleFont=value('googleFont','');
  if(googleFont){
    const link=document.createElement('link');link.rel='stylesheet';
    link.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(googleFont)+':wght@400;600;700;900&display=swap';
    document.head.appendChild(link);document.body.style.fontFamily=`'${googleFont}',sans-serif`;
  }
  const iconStyle=value('iconStyle','dot');
  const icons={dot:'<circle cx="12" cy="12" r="5"/>',star:'<polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>',arrow:'<polyline points="9,18 15,12 9,6"/>',check:'<polyline points="20,6 9,17 4,12"/>',diamond:'<polygon points="12,2 22,12 12,22 2,12"/>',plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'};
  function icon(index){
    if(iconStyle==='number')return `<svg viewBox="0 0 24 24"><text x="12" y="16.5" text-anchor="middle" font-size="13" font-weight="700" fill="#432818">${index+1}</text></svg>`;
    return `<svg viewBox="0 0 24 24"><g stroke="#432818" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">${icons[iconStyle]||icons.dot}</g></svg>`;
  }
  const stage=document.getElementById('stage');
  const rows=items.map(function(text,index){
    const row=document.createElement('div');row.className='row';
    const marker=document.createElement('div');marker.className='icon-circle';marker.innerHTML=icon(index);
    const wrap=document.createElement('div');wrap.className='bubble-wrap';
    const tail=document.createElement('div');tail.className='tail';
    const bubble=document.createElement('div');bubble.className='bubble';
    const content=document.createElement('div');content.className='bubble-text';content.textContent=text;
    bubble.appendChild(content);wrap.appendChild(tail);wrap.appendChild(bubble);row.appendChild(marker);row.appendChild(wrap);stage.appendChild(row);return row;
  });
  let visibleCount=1;
  let revision=0;
  rows[0].classList.add('visible');
  let socket=null;
  let identifiedSocket=null;
  let reconnectTimer=null;
  let requestSequence=1;
  let unloading=false;
  let authenticationBlocked=false;
  const applied=new Map();
  function send(eventData){
    if(unloading||!identifiedSocket||socket!==identifiedSocket||identifiedSocket.readyState!==1)return false;
    identifiedSocket.send(JSON.stringify({op:6,d:{requestType:'BroadcastCustomEvent',requestId:'bullet-manual-'+(requestSequence++).toString(36),requestData:{eventData}}}));
    return true;
  }
  function acknowledgement(operationId){return {type:'bullet_points_manual_ack',sessionId,operationId,connectionGeneration,revision,visibleCount};}
  function validCommand(data){
    if(!data||typeof data!=='object'||data.sessionId!==sessionId||data.connectionGeneration!==connectionGeneration||
      !/^bullet-manual-op-[a-z0-9]+$/.test(String(data.operationId))||!Number.isSafeInteger(data.revision)||
      !Number.isSafeInteger(data.expectedVisibleCount))return false;
    const direction=data.type==='bullet_points_manual_next'?1:data.type==='bullet_points_manual_previous'?-1:0;
    return direction!==0&&data.revision===revision+1&&data.expectedVisibleCount===visibleCount+direction&&
      data.expectedVisibleCount>=1&&data.expectedVisibleCount<=rows.length;
  }
  function apply(data){
    const cached=applied.get(data&&data.operationId);
    if(cached){send(cached);return;}
    if(!validCommand(data))return;
    visibleCount=data.expectedVisibleCount;revision=data.revision;
    rows.forEach((row,index)=>row.classList.toggle('visible',index<visibleCount));
    void stage.offsetHeight;
    const ack=acknowledgement(data.operationId);applied.set(data.operationId,ack);send(ack);
  }
  function scheduleReconnect(current){
    if(unloading||authenticationBlocked||socket!==current||reconnectTimer!==null)return;
    reconnectTimer=setTimeout(function(){reconnectTimer=null;if(!unloading&&socket===current){socket=null;connect();}},2000);
  }
  function connect(){
    if(unloading||authenticationBlocked||reconnectTimer!==null||socket&&(socket.readyState===0||socket.readyState===1))return;
    const current=new WebSocket('ws://127.0.0.1:4455');socket=current;
    current.onmessage=function(event){
      if(unloading||socket!==current)return;
      let message;try{message=JSON.parse(event.data);}catch(_){return;}
      if(message.op===0){
        if(message.d&&Object.prototype.hasOwnProperty.call(message.d,'authentication')){authenticationBlocked=true;current.close();return;}
        current.send(JSON.stringify({op:1,d:{rpcVersion:1,eventSubscriptions:1}}));return;
      }
      if(message.op===2){
        if(message.d&&message.d.negotiatedRpcVersion===1){identifiedSocket=current;send({type:'bullet_points_manual_ready',sessionId,connectionGeneration,revision,visibleCount,totalCount:rows.length});}
        return;
      }
      if(message.op===5&&message.d&&message.d.eventType==='CustomEvent')apply(message.d.eventData);
    };
    current.onerror=function(){if(socket===current){try{current.close();}catch(_){}scheduleReconnect(current);}};
    current.onclose=function(){if(socket===current){identifiedSocket=null;scheduleReconnect(current);}};
  }
  window.addEventListener('beforeunload',function(){unloading=true;if(reconnectTimer!==null)clearTimeout(reconnectTimer);if(socket)try{socket.close();}catch(_){}});
  connect();
})();
</script>
</body>
</html>
